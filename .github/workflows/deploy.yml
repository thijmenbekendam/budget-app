name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/create-new-app-2s18V, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare PWA icons
        run: |
          mkdir -p public
          sudo apt-get install -y imagemagick
          convert assets/icon.png -resize 192x192 public/icon-192.png
          convert assets/icon.png -resize 512x512 public/icon-512.png
          convert assets/icon.png -resize 180x180 public/apple-touch-icon.png

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
